# Touch scrolling and tap-to-select panes
set -g mouse on

# Long scrollback for Claude Code output
set -g history-limit 50000

# Pass Esc through immediately (Claude Code and nvim rely on it)
set -sg escape-time 10

# Colours and key reporting
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -s extended-keys on
set -g focus-events on

# Number windows from 1 and keep them contiguous
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Compact status bar for a narrow screen
set -g status-left "#S "
set -g status-right "%H:%M"
